name: keep the live demo awake

# Render's free plan sleeps after 15 minutes idle; a light ping keeps the judge link instant.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the story page, the live demo and the health check
        run: |
          for path in healthz live ""; do
            curl -fsS -m 90 -o /dev/null -w "/$path %{http_code} in %{time_total}s\n" "https://nova-6kte.onrender.com/$path" || true
          done
