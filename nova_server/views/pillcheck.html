<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pill check</title>
<style>
  :root {
    --bg: #0A0B10;
    --surface: #11131A;
    --surface-2: #191C26;
    --line: rgba(244, 238, 230, .10);
    --text: #F4EEE6;
    --text-2: rgba(244, 238, 230, .74);
    --muted: rgba(244, 238, 230, .46);
    --accent: #3BD1FF;
    --accent-soft: rgba(59, 209, 255, .12);
    --green: #9ED9B0;
    --amber: #FFB547;
    --red: #FF6B57;
    --grey: #B9B2A8;
    --radius: 16px;
    color-scheme: dark;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Segoe UI Mono", Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); color: var(--text); }
  body {
    margin: 0;
    font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, "SF Pro Text", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 18px; line-height: 1.38; -webkit-font-smoothing: antialiased;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.18) transparent;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 8px; }
  #app { padding: 20px 22px 20px; }

  /* Verdict banner */
  .verdict { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 18px; align-items: center; padding: 18px 22px; border-radius: 22px;
    border: 1px solid var(--tone-line); background: linear-gradient(110deg, var(--tone-bg), rgba(255,255,255,.02) 75%); margin-bottom: 16px; }
  .verdict.ok_now { --tone: var(--green); --tone-bg: rgba(61,220,151,.20); --tone-line: rgba(61,220,151,.42); }
  .verdict.wrong_time, .verdict.already_taken { --tone: var(--amber); --tone-bg: rgba(255,181,71,.20); --tone-line: rgba(255,181,71,.42); }
  .verdict.not_on_list { --tone: var(--red); --tone-bg: rgba(255,122,122,.22); --tone-line: rgba(255,122,122,.46); }
  .verdict.dose_mismatch { --tone: #FF8A5B; --tone-bg: rgba(255,138,91,.22); --tone-line: rgba(255,138,91,.48); }
  .verdict.avoid { --tone: var(--red); --tone-bg: rgba(255,107,87,.30); --tone-line: rgba(255,107,87,.7); box-shadow: 0 0 0 1px rgba(255,107,87,.25), 0 0 50px -10px rgba(255,107,87,.45); }
  .verdict.avoid .v-ico { animation: avoidPulse 1.6s ease-out infinite; }
  @keyframes avoidPulse { 0% { box-shadow: 0 0 0 0 rgba(255,107,87,.55); } 100% { box-shadow: 0 0 0 22px rgba(255,107,87,0); } }
  .source { margin: -4px 0 16px; padding: 14px 18px 14px 20px; border-left: 2px solid var(--red); border-radius: 0 14px 14px 0; background: rgba(255,107,87,.06); }
  .source q { display: block; font-family: var(--serif); font-size: 21px; line-height: 1.32; quotes: "\201C" "\201D"; }
  .source cite { display: block; margin-top: 8px; font-family: var(--mono); font-style: normal; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .verdict.check_first { --tone: var(--amber); --tone-bg: rgba(255,181,71,.20); --tone-line: rgba(255,181,71,.46); }
  .verdict.unclear { --tone: var(--grey); --tone-bg: rgba(168,179,196,.14); --tone-line: rgba(168,179,196,.3); }
  .v-ico { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--tone); color: #0A1322; box-shadow: 0 0 0 8px color-mix(in srgb, var(--tone) 18%, transparent); }
  .v-ico svg { width: 38px; height: 38px; }
  .v-kicker { font-size: 13.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--tone); }
  .v-title { font-size: 30px; font-weight: 650; line-height: 1.15; margin-top: 4px; letter-spacing: -.01em; }
  .v-sub { font-size: 18px; color: var(--text-2); margin-top: 4px; }

  .advice { display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); margin-bottom: 16px; }
  .advice svg { width: 26px; height: 26px; color: var(--accent); flex: none; margin-top: 2px; }
  .advice p { margin: 0; font-size: 21px; line-height: 1.38; }

  .section-title { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 10px 2px; }
  .due { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
  .due-item { display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 10px; border-radius: 16px; background: var(--surface); border: 1px solid rgba(0,202,255,.3); }
  .pill-tile { width: 48px; height: 48px; border-radius: 13px; background: rgba(255,255,255,.06); display: grid; place-items: center; flex: none; }
  .pill-tile svg { width: 38px; height: 38px; }
  .due-name { font-size: 19px; font-weight: 600; }
  .due-sub { font-size: 14.5px; color: var(--muted); }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  @media (max-width: 600px) { .compare { grid-template-columns: 1fr; } .verdict { grid-template-columns: 56px 1fr; } .v-ico { width: 56px; height: 56px; } }
  .card { padding: 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--line); min-width: 0; }
  .card-k { font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card-k svg { width: 16px; height: 16px; }
  .card-name { font-size: 22px; font-weight: 600; margin-top: 8px; line-height: 1.2; }
  .card-name span { font-weight: 400; color: var(--text-2); font-size: 18px; margin-left: 6px; }
  .card-line { font-size: 15.5px; color: var(--text-2); margin-top: 6px; }
  .label-text { margin-top: 10px; padding: 9px 11px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px dashed rgba(255,255,255,.14);
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; color: var(--text-2); overflow-wrap: anywhere; }
  .conf { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
  .conf .track { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; }
  .conf .fill { height: 100%; border-radius: 3px; background: var(--accent); }
  .times { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .time { font-size: 14px; font-weight: 600; padding: 3px 11px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .matched-row { display: flex; gap: 12px; align-items: center; margin-top: 8px; }
  .nomatch { margin-top: 10px; font-size: 17px; color: var(--red); font-weight: 600; }

  footer { display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-size: 12.5px; padding: 6px 0 0; }
  footer svg { width: 14px; height: 14px; color: var(--accent); }

  .sk { background: linear-gradient(90deg, rgba(255,255,255,.05) 25%, rgba(255,255,255,.11) 50%, rgba(255,255,255,.05) 75%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: 10px; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  .state { min-height: 220px; display: grid; place-items: center; text-align: center; padding: 30px; }
  .state h2 { margin: 10px 0 6px; font-size: 22px; font-weight: 600; }
  .state p { margin: 0; font-size: 16px; color: var(--muted); max-width: 440px; }
  .state svg { color: var(--text-2); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* ---- Nova studio type system: serif headlines and numerals, mono labels, ivory on ink ---- */
  body { font-family: var(--sans); }
  html { background: var(--bg); }
  .mono-l { font-family: var(--mono); font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
  .btn { background: var(--text); color: var(--bg); box-shadow: 0 6px 20px -8px rgba(0,0,0,.6); }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid rgba(244,238,230,.22); }
  .btn.ghost:hover { background: rgba(244,238,230,.06); }
  .toast { font-family: var(--sans); background: rgba(17,19,26,.95); border-color: rgba(244,238,230,.16); }
  .sk { background: linear-gradient(90deg, rgba(244,238,230,.05) 25%, rgba(244,238,230,.1) 50%, rgba(244,238,230,.05) 75%); background-size: 200% 100%; }
  .state h2 { font-family: var(--serif); font-weight: 400; font-size: 30px; }
  footer { font-family: var(--mono); letter-spacing: .1em; text-transform: uppercase; font-size: 11px; }

  .v-kicker, .section-title, .card-k, .time, .conf, .due-sub { font-family: var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .verdict { border-radius: 24px; padding: 20px 24px; }
  .v-kicker { font-size: 12px; }
  .v-title { font-family: var(--serif); font-weight: 400; font-size: 40px; line-height: 1.05; letter-spacing: -.015em; }
  .v-sub { font-size: 17px; }
  .advice { background: transparent; border: 1px solid rgba(59,209,255,.25); border-radius: 18px; }
  .advice p { font-family: var(--serif); font-size: 25px; line-height: 1.3; }
  .section-title { font-size: 11px; }
  .due-item { background: transparent; border-color: rgba(59,209,255,.35); }
  .due-name { font-family: var(--serif); font-weight: 400; font-size: 22px; }
  .due-sub { font-size: 10px; }
  .card { background: transparent; border: 1px solid var(--line); border-radius: 18px; }
  .card-k { font-size: 10.5px; }
  .card-name { font-family: var(--serif); font-weight: 400; font-size: 28px; }
  .card-name span { font-family: var(--sans); }
  .label-text { font-family: var(--mono); border-color: rgba(244,238,230,.16); }
  .time { font-size: 11px; background: transparent; border: 1px solid rgba(59,209,255,.45); }
  .conf { font-size: 10px; }

  /* Compact: it lives on an Echo Show screen. Verdict, advice and what's due fit above the fold. */
  #app { padding: 14px 16px 18px; }
  .verdict { grid-template-columns: 52px minmax(0, 1fr); gap: 14px; padding: 13px 18px; border-radius: 20px; margin-bottom: 10px; }
  .v-ico { width: 52px; height: 52px; box-shadow: 0 0 0 6px color-mix(in srgb, var(--tone) 18%, transparent); }
  .v-ico svg { width: 28px; height: 28px; }
  .v-kicker { font-size: 10.5px; }
  .v-title { font-size: 31px; }
  .v-sub { font-size: 15px; margin-top: 2px; }
  .advice { padding: 10px 14px; gap: 10px; margin-bottom: 10px; border-radius: 16px; }
  .advice svg { width: 22px; height: 22px; }
  .advice p { font-size: 20px; line-height: 1.28; }
  .source { margin: -2px 0 10px; padding: 10px 14px 10px 16px; }
  .source q { font-size: 18px; }
  .section-title { margin: 0 0 6px 2px; }
  .due { flex-wrap: nowrap; gap: 8px; margin-bottom: 12px; min-width: 0; }
  .due-item { flex: 1 1 0; min-width: 0; gap: 10px; padding: 6px 12px 6px 6px; border-radius: 14px; }
  .due-item .pill-tile { width: 34px; height: 34px; border-radius: 10px; }
  .due-item .pill-tile svg { width: 26px; height: 26px; }
  .due-line { min-width: 0; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; overflow: hidden; }
  .due-name { font-size: 19px; overflow: hidden; text-overflow: ellipsis; }
  .due-sub { flex: none; }
  .due-more { flex: none; align-self: center; font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
  .compare { gap: 10px; }
  .card { padding: 12px 14px; }
  .card-name { font-size: 24px; }

  /* ---- glance: one screen, readable from across the room; the rest is a tap away ---- */
  body.fit { overflow: hidden; }
  body.fit #app { height: var(--vh); padding: 0; overflow: hidden; }
  body.fit #app > .state { height: var(--vh); min-height: 0; }
  .g { display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 14px; box-sizing: border-box; min-height: 0; }
  body.fit .g { height: var(--vh); overflow: hidden; }
  .g-kick { flex: none; display: flex; align-items: center; gap: 9px; min-width: 0; font-family: var(--mono); font-size: 12.5px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; color: var(--tone, var(--muted)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-kick svg { width: 16px; height: 16px; flex: none; }
  .g-kick .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--tone, var(--accent)); box-shadow: 0 0 10px var(--tone, var(--accent)); }
  .g-kick .soft { color: var(--muted); }
  .g-head { flex: none; margin: 0; font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.08; letter-spacing: -.012em; color: var(--text); text-wrap: balance; overflow-wrap: anywhere; }
  .g-sub { flex: none; margin: -3px 0 0; font-size: 19px; line-height: 1.3; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-body { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
  .g-items { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .g-row { display: flex; align-items: center; gap: 12px; padding: 8px 14px; min-height: 48px; box-sizing: border-box; border-radius: 14px; border: 1px solid rgba(244,238,230,.12); min-width: 0; }
  .g-ico { width: 32px; height: 32px; flex: none; display: grid; place-items: center; color: var(--tone, var(--accent)); }
  .g-ico svg { width: 26px; height: 26px; }
  .g-txt { flex: 1; min-width: 0; font-size: 19px; line-height: 1.28; color: var(--text); }
  .g-txt b { font-weight: 600; }
  .g-txt small { display: block; margin-top: 1px; font-size: 16px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-txt .clip2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .g-side { flex: none; display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-2); }
  .g-num { width: 30px; height: 30px; flex: none; border-radius: 50%; display: grid; place-items: center; font-family: var(--serif); font-size: 18px; color: var(--bg); background: var(--text); }
  .g-tag { padding: 4px 10px; border-radius: 999px; border: 1px solid rgba(244,238,230,.22); font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; }
  .g-tag.ok { color: var(--green); border-color: rgba(158,217,176,.45); }
  .g-tag.warn { color: var(--amber); border-color: rgba(255,181,71,.5); }
  .g-tag.bad { color: var(--red); border-color: rgba(255,107,87,.5); }
  .g-foot { flex: none; display: flex; align-items: center; gap: 10px; min-height: 46px; }
  .g-acts { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .g-pager { display: flex; align-items: center; gap: 6px; margin-left: auto; flex: none; }
  .g-nav { height: 42px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(244,238,230,.24); background: transparent; color: var(--text);
    font: 500 16.5px/1 var(--sans); cursor: pointer; white-space: nowrap; }
  .g-nav.more { background: rgba(244,238,230,.09); }
  .g-nav:hover { background: rgba(244,238,230,.14); }
  .g .btn { min-height: 44px; font-size: 17px; padding: 0 22px; display: inline-flex; align-items: center; gap: 8px; }
  .g .btn svg { width: 18px; height: 18px; }
  .g-row .btn { min-height: 38px; font-size: 15.5px; padding: 0 15px; flex: none; }
  .g.steady, .g.ok_now, .g.applied, .g.done { --tone: var(--green); }
  .g.watch, .g.wrong_time, .g.already_taken, .g.pending, .g.missed { --tone: var(--amber); }
  .g.urgent, .g.not_on_list, .g.avoid { --tone: var(--red); }
  .g.dose_mismatch { --tone: #FF8A5B; }
  .g.discarded, .g.unclear { --tone: var(--muted); }
  @media (max-width: 560px) { .g-head { font-size: 32px; } .g-pager .g-nav { padding: 0 12px; } }

  .g .advice { margin: 0; padding: 10px 14px; flex: none; }
  .g .advice p { font-size: 20px; }
  .g .advice p.clip2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .g .source { margin: 0; flex: none; }
  .g .source q { font-size: 19px; }
  .g-ico .pill-tile.sm { width: 32px; height: 32px; border-radius: 9px; }
  .g-ico .pill-tile svg { width: 26px; height: 26px; }
</style>

<script>
"use strict";
/* ---------- MCP Apps bridge (ext-apps 2026-01-26), postMessage JSON-RPC ---------- */
const bridge = (() => {
  const handlers = {};
  const pending = new Map();
  let seq = 0;
  const post = (msg) => { try { window.parent.postMessage(msg, "*"); } catch (_) { /* detached */ } };
  window.addEventListener("message", (ev) => {
    if (ev.source !== window.parent) return;
    const m = ev.data;
    if (!m || typeof m !== "object" || m.jsonrpc !== "2.0") return;
    if (m.method === undefined && m.id !== undefined) {
      const p = pending.get(m.id);
      if (!p) return;
      pending.delete(m.id);
      if (m.error) p.reject(new Error(m.error.message || "Request failed"));
      else p.resolve(m.result);
      return;
    }
    if (m.id !== undefined && m.id !== null) {
      if (m.method === "ping" || m.method === "ui/resource-teardown") post({ jsonrpc: "2.0", id: m.id, result: {} });
      else post({ jsonrpc: "2.0", id: m.id, error: { code: -32601, message: "Method not found: " + m.method } });
      return;
    }
    const h = handlers[m.method];
    if (h) { try { h(m.params || {}); } catch (err) { showState("Something went wrong", String(err && err.message || err)); } }
  });
  return {
    on(method, fn) { handlers[method] = fn; },
    notify(method, params) { post({ jsonrpc: "2.0", method, params: params || {} }); },
    request(method, params, timeoutMs = 30000) {
      const id = ++seq;
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => { pending.delete(id); reject(new Error("The request timed out")); }, timeoutMs);
        pending.set(id, { resolve: (v) => { clearTimeout(timer); resolve(v); }, reject: (e) => { clearTimeout(timer); reject(e); } });
        post({ jsonrpc: "2.0", id, method, params: params || {} });
      });
    },
  };
})();

/* ---------- helpers ---------- */
const $app = document.getElementById("app");
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const arr = (v) => (Array.isArray(v) ? v : []);
const obj = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : null);
const num = (v) => (typeof v === "number" && isFinite(v) ? v : (typeof v === "string" && v.trim() !== "" && isFinite(+v) ? +v : null));
const cap = (s) => { s = String(s || ""); return s ? s[0].toUpperCase() + s.slice(1) : s; };
function structuredFrom(r) {
  if (!r || typeof r !== "object") return null;
  if (r.structuredContent && typeof r.structuredContent === "object") return r.structuredContent;
  for (const b of arr(r.content)) {
    if (b && b.type === "text" && typeof b.text === "string") { try { const v = JSON.parse(b.text); if (v && typeof v === "object") return v; } catch (_) { /* not JSON */ } }
  }
  return null;
}
function textFrom(r) { const b = arr(r && r.content).find((c) => c && c.type === "text"); return b ? String(b.text || "") : ""; }
function joinWords(list) {
  const a = list.filter(Boolean).map(String);
  return a.length <= 1 ? (a[0] || "") : a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
}

const ICON = {
  ok_now: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  wrong_time: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  already_taken: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12.5l4 4L15 9M10.5 15.5l1 1L20 8"/></svg>',
  not_on_list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"/></svg>',
  dose_mismatch: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 6.5v7M12 17.5v.3"/></svg>',
  avoid: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M6.4 17.6L17.6 6.4"/></svg>',
  check_first: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 6.5v7M12 17.5v.3"/></svg>',
  unclear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.5-1.5 1.2-1.5 2.3M12 17.5v.3"/></svg>',
  bulb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>',
  bottle: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="5.5" y="2.5" width="9" height="3" rx="1"/><path d="M6 5.5h8v11a1.5 1.5 0 0 1-1.5 1.5h-5A1.5 1.5 0 0 1 6 16.5z"/><path d="M6 9h8v4.5H6z"/></svg>',
  list: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7.5 5.5h9M7.5 10h9M7.5 14.5h9"/><circle cx="4" cy="5.5" r=".9" fill="currentColor"/><circle cx="4" cy="10" r=".9" fill="currentColor"/><circle cx="4" cy="14.5" r=".9" fill="currentColor"/></svg>',
  spark: '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1l1.6 4.4L14 7l-4.4 1.6L8 13l-1.6-4.4L2 7l4.4-1.6z"/></svg>',
  big: '<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.5"/></svg>',
};

/* Pill glyph drawn from the plain-language appearance ("small pink oval pill"). */
const PILL_COLORS = [["pink", "#F7A8C4"], ["yellow", "#F6CF52"], ["orange", "#F6A04D"], ["blue", "#7DB4FF"], ["red", "#F27C7C"],
  ["green", "#8EDBA9"], ["purple", "#B9A2F5"], ["brown", "#C49A6C"], ["peach", "#F8C3A0"], ["gray", "#C2C8D2"], ["grey", "#C2C8D2"], ["white", "#ECEFF4"]];
function pillSVG(appearance) {
  const a = String(appearance || "").toLowerCase();
  const hit = PILL_COLORS.find(([k]) => a.includes(k));
  const c = hit ? hit[1] : "#DDE3EC";
  const shadow = '<ellipse cx="22" cy="35" rx="13" ry="2.6" fill="rgba(0,0,0,.35)"/>';
  let body;
  if (/softgel|gel cap|gelcap/.test(a)) body = `<ellipse cx="22" cy="21" rx="15" ry="9.5" fill="${c}" opacity=".92"/><ellipse cx="17" cy="17.5" rx="6" ry="2.4" fill="#fff" opacity=".55"/>`;
  else if (/capsule/.test(a)) body = `<rect x="6" y="14" width="32" height="14" rx="7" fill="#ECEFF4"/><path d="M13 14h9v14h-9a7 7 0 0 1 0-14z" fill="${c}"/>`;
  else if (/oblong|long|caplet/.test(a)) body = `<rect x="5" y="14" width="34" height="14" rx="7" fill="${c}"/><path d="M22 15.5v11" stroke="rgba(0,0,0,.18)" stroke-width="1.4"/><rect x="9" y="16.5" width="10" height="2.4" rx="1.2" fill="#fff" opacity=".5"/>`;
  else if (/round|circle/.test(a)) body = `<circle cx="22" cy="21" r="11" fill="${c}"/><path d="M13.5 21h17" stroke="rgba(0,0,0,.16)" stroke-width="1.4"/><ellipse cx="18" cy="16.5" rx="4" ry="2" fill="#fff" opacity=".5"/>`;
  else body = `<ellipse cx="22" cy="21" rx="14" ry="9.5" fill="${c}"/><ellipse cx="17.5" cy="17" rx="5" ry="2.2" fill="#fff" opacity=".5"/>`;
  return `<svg viewBox="0 0 44 44" aria-hidden="true">${shadow}<g transform="rotate(-18 22 21)">${body}</g></svg>`;
}

/* ---------- rendering ---------- */
const KICKER = { ok_now: "Good to take", wrong_time: "Not right now", already_taken: "Already taken", not_on_list: "Not on your list",
  dose_mismatch: "Different strength", avoid: "Don't take this", check_first: "Check first", unclear: "Can't read it" };


const gCap = (s) => { s = String(s || ""); return s ? s.charAt(0).toUpperCase() + s.slice(1) : ""; };
const gObj = (v) => (v && typeof v === "object" && !Array.isArray(v) ? v : null);

/* ---------- glance kit: one screen, readable from across the room ---------- */
// The card fills exactly the space the host gives it (hostContext.containerDimensions.maxHeight). Page one
// is the glance; anything that doesn't fit waits behind "N more on screen ›" (tap to page), never a scroll.
let viewH = 0, pageNo = 0, lastSpec = null, lastKey = null, lastSteps = null;
function setViewport(hc) {
  const h = Number(hc && hc.containerDimensions && hc.containerDimensions.maxHeight);
  if (!(h > 0)) return false;
  const changed = Math.floor(h) !== viewH;
  viewH = Math.floor(h);
  document.documentElement.style.setProperty("--vh", viewH + "px");
  document.body.classList.add("fit");
  return changed;
}
function chunkList(a, n) { const out = []; for (let i = 0; i < a.length; i += n) out.push(a.slice(i, i + n)); return out; }
function cardFits() {
  if (!viewH) return true;
  const g = $app.querySelector(".g"), b = $app.querySelector(".g-body");
  if (!g || !b) return true;
  return b.scrollHeight <= b.clientHeight + 1 && g.scrollHeight <= g.clientHeight + 1;
}
function gRow(ico, txt, side, cls) {
  return `<div class="g-row${cls ? " " + cls : ""}">${ico ? `<div class="g-ico">${ico}</div>` : ""}<div class="g-txt">${txt}</div>${side ? `<div class="g-side">${side}</div>` : ""}</div>`;
}
// spec(per, level) -> { tone, kicker, head, sub, lead, items, take, actions }. Tries 3 items, then fewer,
// then a more compact lead, until the card fits its screen.
const FIT_STEPS = [[3, 0], [2, 0], [2, 1], [1, 1], [1, 2], [0, 2]];
function paintCard(spec, key, steps) {
  if (key !== lastKey) { pageNo = 0; lastKey = key; }
  lastSpec = spec; lastSteps = steps;
  for (const [per, level] of steps || FIT_STEPS) {
    const c = spec(per, level) || {};
    const items = (c.items || []).filter(Boolean);
    const take = Math.min(c.take === undefined ? per : c.take, per);
    const pages = [items.slice(0, take)].concat(chunkList(items.slice(take), Math.max(1, per)));
    if (pageNo >= pages.length) pageNo = 0;
    const shown = pages[pageNo];
    const after = pages.slice(pageNo + 1).reduce((n, p) => n + p.length, 0);
    const pager = pages.length > 1
      ? `<div class="g-pager">${pageNo > 0 ? '<button class="g-nav" type="button" data-page="0">‹ Back</button>' : ""}${after > 0 ? `<button class="g-nav more" type="button" data-page="${pageNo + 1}">${after} more on screen ›</button>` : ""}</div>`
      : "";
    $app.innerHTML = `<div class="g ${c.tone || ""}">${c.kicker ? `<div class="g-kick">${c.kicker}</div>` : ""}
      <h1 class="g-head">${c.head || ""}</h1>${c.sub && pageNo === 0 ? `<p class="g-sub">${c.sub}</p>` : ""}
      <div class="g-body">${pageNo === 0 ? c.lead || "" : ""}${shown.length ? `<div class="g-items">${shown.join("")}</div>` : ""}</div>
      ${c.actions || pager ? `<div class="g-foot"><div class="g-acts">${c.actions || ""}</div>${pager}</div>` : ""}</div>`;
    if (cardFits()) break;
  }
}
function repaint() { if (lastSpec) paintCard(lastSpec, lastKey, lastSteps); }
$app.addEventListener("click", (e) => {
  const p = e.target.closest("[data-page]");
  if (p) { pageNo = Number(p.getAttribute("data-page")) || 0; repaint(); }
});
function render(d) {
  const verdict = Object.prototype.hasOwnProperty.call(KICKER, d.verdict) ? d.verdict : "unclear";
  const idf = obj(d.identified) || {};
  const med = obj(d.matched_med);
  const times = arr(med && med.times).filter(Boolean);
  const idName = [idf.name, idf.strength].filter(Boolean).join(" ");
  const title = {
    ok_now: `Yes, take your ${med && med.name ? med.name : idf.name || "medicine"} now`,
    wrong_time: times.length ? `Not now. This one is for ${joinWords(times)}` : "Not now. It's for a different time",
    already_taken: `You already took your ${med && med.name ? med.name : "medicine"} today`,
    not_on_list: "This isn't on your medicine list",
    dose_mismatch: "Set this bottle aside",
    avoid: `Please don't take ${idf.name ? idf.name.toLowerCase() : "this"}`,
    check_first: "Check with the pharmacist first",
    unclear: "I couldn't read the label",
  }[verdict];
  let sub = verdict === "unclear" ? "Please don't take it yet. Hold the label up to the camera, in good light."
    : verdict === "check_first" ? (arr(d.reasons).length ? `I can't be sure: ${arr(d.reasons).join("; ")}.` : "I can't be sure from this photo.")
    : (idName ? `I see ${idName}` : "");
  if (verdict === "dose_mismatch") {
    sub = idf.strength && med && med.dose ? `This bottle is ${idf.strength}, but your plan is now ${med.dose}.` : "The strength doesn't match your current plan.";
  }
  const due = arr(d.due_now).filter((x) => obj(x));
  paintCard((per, level) => {
    let lead = "";
    if (level < 2) {
      if (verdict === "avoid" && (d.quote || d.source)) lead = `<blockquote class="source"><q>${esc(d.quote || d.advice || "")}</q>${d.source ? `<cite>From ${esc(d.source)}</cite>` : ""}</blockquote>`;
      else if (d.advice) lead = `<div class="advice">${ICON.bulb}<p class="clip2">${esc(d.advice)}</p></div>`;
    }
    const label = verdict === "wrong_time" || verdict === "not_on_list" ? "Take instead" : "Due now";
    const dueRows = due.map((x) => gRow(`<span class="pill-tile sm">${pillSVG(x.appearance)}</span>`,
      `<b>${esc(x.name || "")}</b><small>${esc([x.time_label, gCap(x.appearance)].filter(Boolean).join(" · "))}</small>`, `<span class="g-tag">${label}</span>`));
    const items = dueRows.slice(0, 2);
    items.push(gRow(ICON.bottle, `On the bottle: <b>${esc(idf.name || "Unknown")}${idf.strength ? " " + esc(idf.strength) : ""}</b>${idf.directions ? `<small>${esc(idf.directions)}</small>` : ""}`,
      ""));
    items.push(med
      ? gRow(`<span class="pill-tile sm">${pillSVG(med.appearance)}</span>`, `Your list: <b>${esc(med.name || "")}${med.dose ? " " + esc(med.dose) : ""}</b><small>${esc([times.join(", "), gCap(med.purpose)].filter(Boolean).join(" · "))}</small>`)
      : gRow(ICON.list, `<b>${verdict === "unclear" ? "Nothing to compare yet" : verdict === "avoid" ? "Flagged in your care notes" : "No match on your list"}</b><small>${verdict === "avoid" ? "Your doctors asked you to avoid this one." : "Check with your pharmacist or doctor."}</small>`));
    items.push(...dueRows.slice(2));
    if (verdict === "avoid" && d.quote && d.advice) items.push(gRow(ICON.bulb, `<span class="clip2">${esc(d.advice)}</span>`));
    return {
      tone: verdict,
      kicker: `${ICON[verdict]}${esc(KICKER[verdict])}`,
      head: esc(title), sub: esc(sub) + `<small style="display:block;font-size:14px;margin-top:8px">${esc(d.generated_by || "Image source unavailable")}</small>`, lead, items,
    };
  }, d);
}

function renderSkeleton() {
  $app.innerHTML = `
    <section class="verdict unclear" style="--tone-line:rgba(255,255,255,.08)"><div class="sk" style="width:72px;height:72px;border-radius:50%"></div>
      <div><div class="sk" style="height:13px;width:140px"></div><div class="sk" style="height:28px;width:80%;margin-top:10px"></div></div></section>
    <div class="advice"><div style="flex:1"><div class="sk" style="height:18px"></div><div class="sk" style="height:18px;width:70%;margin-top:10px"></div></div></div>
    <div class="compare"><div class="card"><div class="sk" style="height:60px"></div></div><div class="card"><div class="sk" style="height:60px"></div></div></div>`;
}

function showState(title, detail) {
  $app.innerHTML = `<div class="state"><div>${ICON.big}<h2>${esc(title)}</h2><p>${esc(detail || "")}</p></div></div>`;
}

/* ---------- size reporting ---------- */
let lastH = 0, lastW = 0, rafId = 0;
function reportSize() {
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(() => {
    const rect = $app.getBoundingClientRect();
    const h = Math.ceil(rect.height), w = Math.ceil(rect.width);
    if (h === lastH && w === lastW) return;
    lastH = h; lastW = w;
    bridge.notify("ui/notifications/size-changed", { width: w, height: h });
  });
}
if ("ResizeObserver" in window) new ResizeObserver(reportSize).observe($app);

/* ---------- lifecycle ---------- */
bridge.on("ui/notifications/tool-input", () => {});
bridge.on("ui/notifications/tool-result", (params) => {
  if (params && params.isError) { showState("I couldn't check that photo", textFrom(params) || "Please try again in a moment."); return; }
  const data = structuredFrom(params);
  if (!data) { showState("I couldn't check that photo", "Nova didn't send any details this time."); return; }
  render(data);
});
bridge.on("ui/notifications/tool-cancelled", (p) => showState("Cancelled", (p && p.reason) || ""));
bridge.on("ui/notifications/host-context-changed", (p) => { if (setViewport(p)) repaint(); });

renderSkeleton();
reportSize();
if (window.parent === window) {
  showState("Open this from Alexa", "Show Alexa a pill bottle and Nova will check it against your medicine list.");
} else {
  bridge.request("ui/initialize", {
    appCapabilities: { availableDisplayModes: ["inline"] },
    clientInfo: { name: "nova-pillcheck", version: "0.2.0" },
    protocolVersion: "2026-01-26",
  }, 10000).then((res) => { setViewport(res && res.hostContext); return res; }).then(() => bridge.notify("ui/notifications/initialized", {}))
    .catch(() => showState("Couldn't connect", "This view needs an MCP Apps host."));
}
</script>
</body>
</html>
