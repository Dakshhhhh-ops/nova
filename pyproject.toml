[project]
name = "nova-care"
version = "0.1.0"
description = "Nova: a care circle for Alexa+, built as an MCP server (Streamable HTTP, spec 2025-11-25) with an Alexa+ simulator."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "boto3>=1.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
